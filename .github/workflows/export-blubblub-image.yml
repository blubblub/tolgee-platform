name: Export Blub Blub image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/blubblub/tolgee-platform:v3.215.0-blubblub.1

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - run: docker pull --platform linux/amd64 "$IMAGE"
      - run: docker save --output tolgee-platform-linux-amd64.tar "$IMAGE" && gzip -1 tolgee-platform-linux-amd64.tar

      - uses: actions/upload-artifact@v4
        with:
          name: tolgee-platform-linux-amd64
          path: tolgee-platform-linux-amd64.tar.gz
          compression-level: 0
          retention-days: 1
